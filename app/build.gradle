plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.solosu.mtforum'
    compileSdk 36
    // AGP 8.13 默认要 35.0.0，本机 SDK 只装了 36.0.0，且容器禁止自动下载 SDK 组件。
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.solosu.mtforum.tp'
        minSdk 29
        targetSdk 36
        versionCode 8
        versionName "2.3.1"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "mtforum123"
            keyAlias "mtforum"
            keyPassword "mtforum123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            // 调试包沿用 AGP 默认的 debug 签名
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            shrinkResources false
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    implementation libs.kotlin.stdlib
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    // 注：曾引 vectordrawable / lifecycle-livedata / lifecycle-viewmodel /
    //     navigation-fragment / navigation-ui，全项目零 import（nav_graph 也无 NavHost
    //     承载），已移除。需要时再加回并同步更新 libs.versions.toml。
    implementation libs.jsoup
    implementation libs.glide
    implementation libs.okhttp
    implementation libs.swiperefreshlayout
    implementation libs.recyclerview
    implementation libs.androidx.viewpager2
    implementation libs.androidx.drawerlayout
}
